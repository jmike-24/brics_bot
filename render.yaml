# Render Blueprint — Design Task Bot (бесплатный тариф)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: design-task-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
